<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics • TaskPro Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="loadAnalyticsPage()">

    <div class="mesh-gradient"></div>

    <div class="app-shell">
        
        <!-- GLOBAL SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">TP</div>
                <span>TaskPro</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <span class="icon">🏠</span> Overview
                </a>
                <a href="tasks.html" class="nav-link">
                    <span class="icon">📋</span> My Tasks
                </a>
                <a href="analytics.html" class="nav-link active">
                    <span class="icon">📊</span> Analytics
                </a>
                <a href="ai.html" class="nav-link">
                    <span class="icon">✨</span> AI Copilot
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout">
                    <span>🚪</span> Logout
                </button>
            </div>
        </aside>

        <main class="content-view">
            <header class="view-header">
                <div class="header-left">
                    <h1>Performance Analytics</h1>
                    <p>Deep dive into your productivity trends</p>
                </div>
                <div class="header-right">
                    <button class="btn-icon" onclick="exportTasks()">📥 Export Data</button>
                </div>
            </header>

            <div class="view-body">
                
                <div class="analytics-grid">
                    
                    <div class="analytics-card full-width">
                        <h3>Velocity Trend (7 Days)</h3>
                        <div class="chart-box-large">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>

                    <div class="analytics-card">
                        <h3>Activity Heatmap</h3>
                        <p class="text-muted">Consistent productivity over 30 days</p>
                        <div id="heatmap" class="heatmap-large"></div>
                    </div>

                    <div class="analytics-card">
                        <h3>Task Breakdown</h3>
                        <div id="categoryStats" class="stat-list">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <script src="storage.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
