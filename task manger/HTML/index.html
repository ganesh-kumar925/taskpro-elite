<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login • Task Manager Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Left Side: Form -->
            <div class="auth-form-section">
                <div class="form-header">
                    <div class="logo-circle">TP</div>
                    <h1>Welcome Back</h1>
                    <p>Enter your details to manage your daily tasks.</p>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="name@company.com" required />
                    </div>
                    
                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required />
                    </div>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <p class="auth-footer">
                    Don't have an account? <a href="register.html">Create an account</a>
                </p>
            </div>

            <!-- Right Side: Image/Branding -->
            <div class="auth-visual-section">
                <div class="visual-content">
                    <img src="/ChatGPT Image May 7, 2026, 06_57_36 PM.png" alt="Productivity Illustration" class="floating-img" />
                    <div class="quote-box">
                        <p>"The best way to predict the future is to create it."</p>
                        <span>— Peter Drucker</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
